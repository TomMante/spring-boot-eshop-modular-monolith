apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: eshop-modulith-app
  name: eshop-modulith-configmap
data:
  application.yaml: |
    spring:
      application:
        name: eshopmodularmonolith
      datasource:
        url: jdbc:postgresql://host.minikube.internal:5432/EShopDb
        username: postgres
        password: postgres
      jpa:
        hibernate:
          ddl-auto: validate
        database-platform: org.hibernate.dialect.PostgreSQLDialect
