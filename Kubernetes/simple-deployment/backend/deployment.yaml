apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: eshop-modulith-app
    instance: eshop-modulith-app
  name: eshop-modulith-app
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: eshop-modulith-app
      instance: eshop-modulith-app
  template:
    metadata:
      labels:
        app: eshop-modulith-app
        instance: eshop-modulith-app
    spec:
      volumes:
        - name: config-volume
          configMap:
            name: eshop-modulith-configmap
            items:
              - key: application.yaml
                path: application.yml
      containers:
        - name: eshop-modulith
          image: sb-eshop:test
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1002
            runAsGroup: 1002
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            - name: config-volume
              mountPath: /config
              readOnly: true
          env:
            - name: SPRING_CONFIG_IMPORT
              value: "optional:/config/application.yml"
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi