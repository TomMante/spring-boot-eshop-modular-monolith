spring:
  application:
    name: eshopmodularmonolith
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/eshop
          audiences:
            - eshop-app
  datasource:
    url: jdbc:postgresql://localhost:5432/EShopDb
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect