eshop:
  catalog:
    seed-demo-data: true

spring:
  application:
    name: eshopmodularmonolith
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/eshop
          audiences:
            - eshop-app
  datasource:
    url: jdbc:postgresql://localhost:5432/EShopDb
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  mongodb:
    uri: mongodb://localhost:27020
    representation:
      uuid: standard
  data:
    mongodb:
      representation:
        big-decimal: decimal128

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
