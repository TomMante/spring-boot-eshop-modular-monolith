services:
  eshopdb:
    image: postgres:18.1-alpine3.23
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=EShopDb
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      # -h forces TCP: during first-boot init the entrypoint runs a temporary server on the
      # unix socket only, so a socket check would report ready before postgres-init has run.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d EShopDb"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongodb:
    image: mongo:8.2.5-noble
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27020:27017"
    healthcheck:
      test: mongosh --port 27017 --quiet --eval "try { rs.status().ok } catch(e) { 0 }"
      interval: 5s
      timeout: 5s
      retries: 20
  mongo-init:
    image: mongo:8.2.5-noble
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    # Compose reruns this on every up or run; rs.status() throws only while the replica set is uninitialised.
    entrypoint: >
      mongosh --host mongodb:27017 --eval
      'try { rs.status() } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]}) }'
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.4
    depends_on:
      eshopdb:
        condition: service_healthy
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://eshopdb/EShopDb?currentSchema=identity
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=postgres
      # Fixes the issuer in every token to the host-facing URL, also for tokens requested on
      # keycloak:8080 from inside the network, so the app accepts tokens from both sides.
      - KC_HOSTNAME=http://localhost:9090
      - KC_HEALTH_ENABLED=true
    volumes:
      - ./keycloak-init/eshop-realm.json:/opt/keycloak/data/import/eshop-realm.json
    ports:
      - "9090:8080"
    command:
      - "start-dev"
      - "--import-realm"
    healthcheck:
      # The image has no curl or wget; bash's /dev/tcp asks the management port (9000) directly.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
  payment-provider:
    # A Stripe stand-in: WireMock serving the Stripe-shaped stubs in ./payment-provider/mappings.
    # Keep the tag equal to wiremock.version in the root pom, so the tests run the same WireMock build.
    image: wiremock/wiremock:3.13.2
    volumes:
      - ./payment-provider:/home/wiremock:ro
    ports:
      - "12111:8080"
  app:
    # Started only with --profile app or --profile e2e; without either, run the application on the host instead.
    profiles: ["app", "e2e"]
    build:
      context: ../..
    depends_on:
      eshopdb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
      payment-provider:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://eshopdb:5432/EShopDb
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/?replicaSet=rs0
      - ESHOP_BASKET_PAYMENT_STRIPE_APIBASE=http://payment-provider:8080
      # Keys come from inside the network; the issuer stays the host-facing URL that KC_HOSTNAME fixes.
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI=http://keycloak:8080/realms/eshop/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
  e2e:
    # Runs the end-to-end suite once, from the e2e folder as it is on disk:
    # docker compose --profile e2e run --rm --build e2e
    profiles: ["e2e"]
    image: eclipse-temurin:25-jdk-alpine-3.23
    working_dir: /e2e
    command: ["./mvnw", "-B", "verify"]
    depends_on:
      app:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      - E2E_APP_URL=http://app:8080
      - E2E_KEYCLOAK_URL=http://keycloak:8080
    volumes:
      - ../../../e2e:/e2e
      # Maven, its wrapper download and the suite's dependencies, kept between runs.
      - e2e-maven-repository:/root/.m2

volumes:
  e2e-maven-repository: