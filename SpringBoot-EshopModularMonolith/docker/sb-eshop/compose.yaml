services:
  eshopdb:
    image: postgres:18.1-alpine3.23
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=EShopDb
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d
  mongodb:
    image: mongo:8.2.5-noble
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - 27020:27017
    healthcheck:
      test: mongosh --port 27017 --quiet --eval "try { rs.status().ok } catch(e) { 0 }"
      interval: 5s
      timeout: 5s
      retries: 20
  mongo-init:
    image: mongo:8.2.5-noble
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      mongosh --host mongodb:27017 --eval
      'rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]})'
#  sb-eshop:
#    image: sb-eshop:test
#    environment:
#      - SPRING_PROFILES_ACTIVE=local
#      - SPRING_DATASOURCE_URL=jdbc:postgresql://eshopdb:5432/EShopDb
#      - SPRING_DATASOURCE_PASSWORD=postgres
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.4
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://eshopdb/EShopDb?currentSchema=identity
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=postgres
    volumes:
      - ./keycloak-init/eshop-realm.json:/opt/keycloak/data/import/eshop-realm.json
    ports:
      - "9090:8080"
    command:
      - "start-dev"
      - "--import-realm"