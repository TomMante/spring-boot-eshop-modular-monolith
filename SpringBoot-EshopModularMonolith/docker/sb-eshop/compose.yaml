services:
  eshopdb:
    image: postgres:18.1-alpine3.23
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=EShopDb
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d
  mongodb:
    image: mongo:8.2.5-noble
    ports:
      - 27020:27017
#  sb-eshop:
#    image: sb-eshop:test
#    environment:
#      - SPRING_PROFILES_ACTIVE=local
#      - SPRING_DATASOURCE_URL=jdbc:postgresql://eshopdb:5432/EShopDb
#      - SPRING_DATASOURCE_PASSWORD=postgres
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.4
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://eshopdb/EShopDb?currentSchema=identity
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=postgres
    restart: always
    volumes:
      - ./keycloak-init/eshop-realm.json:/opt/keycloak/data/import/eshop-realm.json
    ports:
      - "9090:8080"
    command:
      - "start-dev"
      - "--import-realm"